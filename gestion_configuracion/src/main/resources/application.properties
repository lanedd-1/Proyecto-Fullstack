spring.application.name=gestion_configuracion
server.port=8073

spring.datasource.url=jdbc:mysql://mysql:3306/db_configuracion
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.joyeria.gestion_configuracion=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN

springdoc.api-docs.enabled=true
#URL de acceso: http://localhost:8073/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion_configuracion
eureka.instance.instance-id=gestion_configuracion:${server.port}


ms.usuario.url=http://localhost:8080
