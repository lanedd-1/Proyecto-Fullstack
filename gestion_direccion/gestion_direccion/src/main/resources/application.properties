# ============================================================
# gestion_direccion - application.properties
# Spring Boot | MySQL via Contenedor / XAMPP modificado
# ============================================================

server.port=8081
spring.application.name=gestion_direccion

# ============================================================
# Conexion a MySQL
# BD PROPIA del microservicio: db_direccion
# ============================================================
spring.datasource.url=jdbc:mysql://mysql:3306/db_direccion?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---
logging.level.com.semestral.gestion_direccion=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- Feign Clients ---
# NOTA DOCKER: Si los otros microservicios también corren en contenedores,
# recuerda cambiar "localhost" por el nombre de su contenedor en la red (ej. http://gestion_usuarios:8080)
ms.usuario.url=http://localhost:8080
ms.estado.url=http://localhost:8071

# ============================================================
# Registro en Eureka
# ============================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion_direccion
eureka.instance.instance-id=${spring.application.name}:${server.port}