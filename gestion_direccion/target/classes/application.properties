spring.application.name=gestion_direccion
server.port=8081

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/db_direccion
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.com.semestral.gestion_direccion=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

springdoc.api-docs.enabled=true
#http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

ms.usuario.url=http://localhost:8080
ms.estado.url=http://localhost:8071

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion_direccion
eureka.instance.instance-id=${spring.application.name}:${server.port}