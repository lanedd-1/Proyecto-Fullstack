# --- Configuración del Servidor ---
spring.application.name=gestion-envio
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/db_envio
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# --- Configuración de Logs ---
logging.level.com.Joyeria.gestion_envio=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# Feign Clients
ms.usuario.url=http://localhost:8080
ms.direccion.url=http://localhost:8081
ms.venta.url=http://localhost:8092

# ==========================================
# EUREKA CLIENT CONFIGURATION
# ==========================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion-envio
eureka.instance.instance-id=${spring.application.name}:${server.port}