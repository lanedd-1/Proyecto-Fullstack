# ============================================================
# gestion-envio - application.properties
# Spring Boot | MySQL via Contenedor / XAMPP modificado
# ============================================================

server.port=8082
spring.application.name=gestion-envio

# ============================================================
# Conexion a MySQL
# BD PROPIA del microservicio: db_envio
# ============================================================
spring.datasource.url=jdbc:mysql://mysql:3306/db_envio?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Logging ---
logging.level.com.Joyeria.gestion_envio=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# --- Feign Clients ---
# NOTA DOCKER: Si los otros microservicios también corren en contenedores,
# recuerda cambiar "localhost" por el nombre de su contenedor en la red.
ms.usuario.url=http://localhost:8080
ms.direccion.url=http://localhost:8081
ms.venta.url=http://localhost:8092

# ============================================================
# Registro en Eureka
# ============================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion-envio
eureka.instance.instance-id=${spring.application.name}:${server.port}