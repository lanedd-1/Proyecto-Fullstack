# --- Configuración del Servidor ---
spring.application.name=gestion-envio
server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/envios_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# --- Configuración de Logs ---
logging.level.com.Joyeria.gestion_envio=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

ms.usuario.url=http://localhost:8080
ms.direccion.url=http://localhost:8081
ms.venta.url=http://localhost:8090