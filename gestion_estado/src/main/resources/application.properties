spring.application.name=gestionestado

server.port=8071

spring.datasource.url=jdbc:mysql://localhost:3306/db_estado
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.joyeria.ms_estado_demo=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

springdoc.api-docs.enabled=true
#URL de acceso: http://localhost:8071/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

ms.envio.url=http://localhost:8082
