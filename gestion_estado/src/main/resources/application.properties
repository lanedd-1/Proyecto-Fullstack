spring.application.name=gestionestado

server.port=8072

spring.datasource.url=jdbc:mysql://localhost:3306/db_estado
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

springdoc.api-docs.enabled=true
#URL de acceso: http://localhost:8072/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html


eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=gestion_estados
eureka.instance.instance-id=gestion_estados:${server.port}


ms.envio.url=http://localhost:8082
