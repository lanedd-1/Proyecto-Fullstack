spring.application.name=gestion-usuarios
server.port=8082

# Base de Datos
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.semestral.gestion_usuarios=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate.orm.jdbc.bind=DEBUG
logging.level.root=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# OPENAPI / Swagger UI
springdoc.api-docs.enabled=true
#URL de acceso: http://localhost:8082/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui.html

# Feign Client (ms-estado)
ms.estado.url=http://localhost:8071