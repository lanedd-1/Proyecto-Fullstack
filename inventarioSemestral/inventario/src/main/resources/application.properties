spring.application.name=inventario
# ============================================================
# CONFIGURACION DE BASE DE DATOS
# Crea una base de datos vacia llamada "db_productos" en phpMyAdmin
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# CONFIGURACION JPA / HIBERNATE
# ============================================================
# create-drop: crea las tablas al iniciar y las elimina al cerrar (ideal para desarrollo)
# Cambiar a "update" si quieres conservar datos entre reinicios
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# CONFIGURACION DE LOGS (SLF4J / Logback)
# ============================================================

# Nivel DEBUG para nuestro paquete: muestra DEBUG, INFO, WARN y ERROR
# En produccion se cambiaria a INFO para reducir volumen
logging.level.com.ejemplo.msproductos=DEBUG

# Nivel WARN para Spring en general: solo muestra alertas y errores del framework
logging.level.org.springframework=WARN

# Nivel para Hibernate SQL: DEBUG muestra los parametros de cada consulta
logging.level.org.hibernate.orm.jdbc.bind=DEBUG

# Nivel raiz del sistema: WARN para no inundar la consola
logging.level.root=WARN

# Formato de cada linea de log en consola:
# %d        = fecha y hora
# [%5level] = nivel con padding (DEBUG, INFO , WARN , ERROR)
# %logger{30} = nombre del logger (nombre de la clase, recortado a 30 chars)
# %msg      = el mensaje que escribimos con logger.info(...) etc.
# %n        = salto de linea
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{30} - %msg%n

# ============================================================
# CONFIGURACION DEL SERVIDOR
# ============================================================
server.port=8081
